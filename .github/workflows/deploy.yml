name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend – install & typecheck
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma generate
          pnpm tsc --noEmit

      - name: Frontend – install & typecheck
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit

  deploy:
    name: Deploy to VPS
    needs: typecheck
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull latest code
        run: |
          cd /opt/dreamyvoice/app
          git pull origin main

      - name: Build Docker images
        run: |
          cd /opt/dreamyvoice/app
          docker compose -f docker-compose.prod.yml build

      - name: Start DB and wait for healthy
        run: |
          cd /opt/dreamyvoice/app
          docker compose -f docker-compose.prod.yml up -d db
          timeout 60 bash -c \
            'until docker compose -f docker-compose.prod.yml ps db | grep -q "(healthy)"; do sleep 3; done'

      - name: Run DB migrations
        run: |
          cd /opt/dreamyvoice/app
          docker compose -f docker-compose.prod.yml run --rm --no-deps \
            backend npx prisma migrate deploy

      - name: Start all services
        run: |
          cd /opt/dreamyvoice/app
          # Remove stale named containers that may belong to a different compose project
          docker rm -f dreamy_backend dreamy_frontend dreamy_caddy 2>/dev/null || true
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Health check
        run: |
          sleep 15
          cd /opt/dreamyvoice/app
          docker compose -f docker-compose.prod.yml ps

      - name: Prune old images
        run: docker image prune -f
